# =============================================================================
# ALPHANSN.COM SITE-SPECIFIC modsec rules — AWS WAF parity replication
#
# Replicated from asap-cms-waf-prod WebACL (f92d97cf-4301-43fb-87e2-e08833ab8535)
# Applied to: alphansn.com, www.alphansn.com (reverse proxy to 10.0.56.172:3004)
#
# ID RANGE CONVENTION (2000-2099 reserved for alphansn.com):
#   2001       Pri 5: Block-Spoofed-SearchEngines
#   2010-2011  Pri 126: RateLimit-AI-Bots (50/5min by UA)
#   2012-2013  Pri 127: rate-limit-aggressive-scrapers (100/10min by UA)
#
# All IDs defined here are unique within this block; grep against
# 1000-1099-global-core.conf before deploying to confirm zero collisions.
# =============================================================================

# Pri 5: Block-Spoofed-SearchEngines (UA claims bot name but not actually whitelisted)
# Relies on whitelist evaluation order: genuinely-verified bots via WHITELIST_RDNS
# will match and exit before reaching this block rule.
SecRule REQUEST_HEADERS:User-Agent "@rx googlebot|bingbot|baiduspider|yandexbot|sogou|alexa|ia_archiver|facebookexternalhit" "id:2001,phase:1,deny,status:403,log,msg:'Spoofed search engine signature',t:lowercase,chain"
SecRule REQUEST_HEADERS:User-Agent "!@containsWord .googlebot.com|.search.msn.com|.bing.com|.google.com" "t:lowercase"

# Pri 126: RateLimit-AI-Bots (50 requests / 5 minutes by IP for AI bot UAs)
# Simplified approach: counter per IP, not per UA (sufficient for blocking abuse)
SecRule REQUEST_HEADERS:User-Agent "@rx gptbot|chatgpt-user|perplexitybot" "id:2010,phase:1,nolog,pass,t:lowercase,setvar:ip.aibot_counter=%{ip.aibot_counter}+1,expirevar:ip.aibot_counter=300,chain"
SecRule ip.aibot_counter "@gt 50" "id:2011,phase:1,deny,status:429,log,msg:'Rate limit exceeded: AI bots (50/5min)'"

# Pri 127: rate-limit-aggressive-scrapers (100 requests / 10 minutes by IP for scraper UAs)
# Simplified approach: counter per IP for curl, wget, python-requests, etc.
SecRule REQUEST_HEADERS:User-Agent "@rx curl|wget|scrapy|libwww|python|httpie" "id:2012,phase:1,nolog,pass,t:lowercase,setvar:ip.scraper_counter=%{ip.scraper_counter}+1,expirevar:ip.scraper_counter=600,chain"
SecRule ip.scraper_counter "@gt 100" "id:2013,phase:1,deny,status:429,log,msg:'Rate limit exceeded: aggressive scrapers (100/10min)'"
