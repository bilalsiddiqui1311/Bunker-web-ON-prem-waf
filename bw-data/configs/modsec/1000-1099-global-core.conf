# Global ModSecurity WAF Rules
# ID Range: 1000-1099 (global, all domains)
# For domain-specific rules: create bw-data/configs/modsec/<domain>/ folder

# Block requests without User-Agent header
SecRule &REQUEST_HEADERS:User-Agent "@eq 0" \
  "id:1001,phase:1,deny,status:403,log,msg:'Missing User-Agent'"

# Block if Host header is an IP address (not a domain)
SecRule REQUEST_HEADERS:Host "@rx ^([0-9]{1,3}\.){3}[0-9]{1,3}$" \
  "id:1002,phase:1,deny,status:403,log,msg:'Host header is an IP address'"

# Block if Host header is missing
SecRule &REQUEST_HEADERS:Host "@eq 0" \
  "id:1003,phase:1,deny,status:403,log,msg:'Missing Host header'"

# Block common malicious bots and scanners
SecRule REQUEST_HEADERS:User-Agent "@rx (sqlmap|nikto|nessus|nmap|masscan|metasploit|shodan)" \
  "id:1004,phase:1,deny,status:403,log,msg:'Malicious bot detected',t:lowercase"

# Block SQL injection patterns
SecRule ARGS|REQUEST_HEADERS "@rx (union.*select|select.*from|insert.*into|delete.*from|update.*set)" \
  "id:1005,phase:2,deny,status:403,log,msg:'SQL injection attempt detected',t:lowercase,t:urlDecode"

# Block XSS attempts
SecRule ARGS|REQUEST_BODY "@rx <script[^>]*>|javascript:|onerror=|onload=" \
  "id:1006,phase:2,deny,status:403,log,msg:'XSS attempt detected',t:lowercase,t:htmlEntityDecode"

# Block access to sensitive files
SecRule REQUEST_URI "@rx (\.env|\.git|\.aws|dockerfile|docker-compose|\.htaccess|web\.config)" \
  "id:1007,phase:1,deny,status:403,log,msg:'Access to sensitive file attempted',t:lowercase"

# Block path traversal attempts
SecRule REQUEST_URI "@rx \.\./|\.\.\\" \
  "id:1008,phase:1,deny,status:403,log,msg:'Path traversal attempt'"
