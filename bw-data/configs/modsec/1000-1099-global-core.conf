# =============================================================================
# GLOBAL modsec rules — applies to every service on this BunkerWeb instance.
#
# ID RANGE CONVENTION (write this down somewhere permanent, e.g. the README):
#   1000-1099  reserved for GLOBAL rules (this file)
#   2000-2099  reserved for alphansn.com / www.alphansn.com (site-specific)
#   3000-3099  reserved for bunkerweb.we-are-asap.com (site-specific)
#   4000-4099  reserved for the next site added after that
# Never reuse an ID across files. This convention is the direct fix for the
# incident that took the old server down: two independent SecRule directives
# in the same file both used id:1002, which ModSecurity requires to be
# globally unique — nginx -t silently refused to load ANY config until it
# was found and fixed. Keeping ranges far apart makes that class of bug
# structurally impossible to repeat by accident.
# =============================================================================

SecRule &REQUEST_HEADERS:User-Agent "@eq 0" "id:1001,phase:1,deny,status:403,log,msg:'Missing User-Agent'"

SecRule REQUEST_HEADERS:Host "@rx ^([0-9]{1,3}\.){3}[0-9]{1,3}$" "id:1002,phase:1,deny,status:403,log,msg:'Host header is an IPv4 address'"

SecRule REQUEST_HEADERS:Host "@rx ^\[[0-9a-f:]+\]$" "id:1003,phase:1,deny,status:403,log,msg:'Host header is an IPv6 address',chain"
SecRule REQUEST_HEADERS:Host "@rx ^\[[0-9a-f:]+\]$" "t:lowercase"

SecRule &REQUEST_HEADERS:Host "@eq 0" "id:1004,phase:1,deny,status:403,log,msg:'Missing Host header'"

SecRule REQUEST_HEADERS:User-Agent "@rx meta-(externalagent|webindexer)|facebookexternalhit|amazon(-ad)?bot|semrushbot|dataforseobot|yandex|headlesschrome|amzn-searchbot|seranking|ahrefs|aws-security-scanner|bytespider|presto|opera[ /]([1-9]|1[0-2])\.|msie\s*[6-8]|mozilla/3\.0|windows\s*nt\s*[56]\.[0-9]|rv:2\.0\.1|firefox/5\.0\.1|headless|phantom|puppeteer|selenium|playwright|python|curl|wget|scrapy|libwww|okhttp|(go-)?httpclient|iphone\s*os\s*[1-9]_|android\s*[1-4]\.|windows\s*(98|xp)|crawler\b|spider\b|tiktokspider\b|asaprushbot|siteauditbot|splitsignalbot|rytebot" "id:1005,phase:1,deny,status:403,log,msg:'Harmful bot signature',t:lowercase"

SecRule REQUEST_URI "@rx (^|/)(\.env|\.git|\.svn|\.ssh|\.aws|\.docker|\.github|\.gitlab-ci|\.vscode)(/|$)|(^|/)(\.htpasswd|\.npmrc|\.boto|\.s3cfg|\.gitconfig|\.git-credentials)(/|$)|/(docker-compose|dockerfile|terraform\.tfstate|secrets|credentials)(/|\.|\b)|/(service_account|serviceAccountKey|firebase-adminsdk|firebase-service-account|key)\.json$|^/z9x8c7v6b5-debug-trigger" "id:1006,phase:1,deny,status:403,log,msg:'Common exploit scan path',t:lowercase"

SecRule REQUEST_HEADERS:User-Agent "@rx (ppc mac os x|serpstatbot|iboubot|linkupbot|libredtail|r00ts3c|xfa1)|^zanur/|opendirme|tlm-audit-scanner|mac os x 10_9_5.*chrome/13|(msie [6-9]\.0|msie 10\.0|trident/[45]\.0|rv:1\.9\.|gecko/200[0-9]|presto/|opera/9\.|applewebkit/52[0-9]|applewebkit/53[0-4]|windows nt 7\.1)" "id:1007,phase:1,deny,status:403,log,msg:'Hostile UA signature',t:lowercase"

SecRule REQUEST_HEADERS:User-Agent|ARGS "@contains if(now()=sysdate(),sleep(15),0)" "id:1008,phase:2,deny,status:403,log,msg:'SQLi sleep payload',t:urlDecodeUni,t:lowercase"

# IDs 1009-1099 are free for future global rules.
