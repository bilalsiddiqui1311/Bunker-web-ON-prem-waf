x-bw-api-env: &bw-api-env
  API_WHITELIST_IP: "127.0.0.0/8 10.0.0.0/8"
  API_HTTP_PORT: "5000"
  API_LISTEN_IP: "0.0.0.0"
  API_SERVER_NAME: "bwapi"

x-bw-db-env: &bw-db-env
  DATABASE_URI: "mariadb+pymysql://bunkerweb:${DB_PASSWORD}@bw-db:3306/bunkerweb"

services:
  bunkerweb:
    image: bunkerity/bunkerweb:1.6.14
    ports:
      - "80:8080/tcp"
      - "443:8443/tcp"
      - "443:8443/udp"
    environment:
      <<: *bw-api-env
    logging:
      driver: syslog
      options:
        syslog-address: "udp://10.20.30.254:514"
        tag: bunkerweb
    restart: "unless-stopped"
    networks:
      - bw-universe
      - bw-services

  bw-scheduler:
    image: bunkerity/bunkerweb-scheduler:1.6.14
    depends_on:
      - bunkerweb
    environment:
      <<: *bw-api-env
      DATABASE_URI: "mariadb+pymysql://bunkerweb:${DB_PASSWORD}@bw-db:3306/bunkerweb"
      BUNKERWEB_INSTANCES: "bunkerweb"
      UI_HOST: "http://bw-ui:7000"
      SERVER_NAME: "${SERVER_NAMES}"
      MULTISITE: "yes"
      USE_UI: "yes"
      USE_CROWDSEC: "yes"
      CROWDSEC_API: "http://crowdsec:8080"
      CROWDSEC_API_KEY: "${CROWDSEC_API_KEY}"
      CROWDSEC_MODE: "live"
      EMAIL_LETS_ENCRYPT: "${EMAIL_LETS_ENCRYPT}"
      USE_LETS_ENCRYPT_STAGING: "${USE_LETS_ENCRYPT_STAGING}"
      alphansn.com_USE_REVERSE_PROXY: "yes"
      alphansn.com_REVERSE_PROXY_HOST: "http://10.0.56.172:3004"
      alphansn.com_REVERSE_PROXY_URL: "/"
      alphansn.com_AUTO_LETS_ENCRYPT: "yes"
      www.alphansn.com_USE_REVERSE_PROXY: "yes"
      www.alphansn.com_REVERSE_PROXY_HOST: "http://10.0.56.172:3004"
      www.alphansn.com_REVERSE_PROXY_URL: "/"
      www.alphansn.com_AUTO_LETS_ENCRYPT: "yes"
      bunkerweb.we-are-asap.com_USE_TEMPLATE: "ui"
      bunkerweb.we-are-asap.com_USE_UI: "yes"
      bunkerweb.we-are-asap.com_USE_REVERSE_PROXY: "yes"
      bunkerweb.we-are-asap.com_REVERSE_PROXY_HOST: "http://bw-ui:7000"
      bunkerweb.we-are-asap.com_REVERSE_PROXY_URL: "/"
      bunkerweb.we-are-asap.com_AUTO_LETS_ENCRYPT: "yes"
      # AWS WAF parity rules (Pri 1, 3, 17, 21, 0/207, 101, 206, 136, 137, 209, 211, 212)
      WHITELIST_IP: "193.186.4.116 119.155.11.236 122.161.65.162 103.84.54.52 103.55.90.231 110.93.201.66 103.102.159.17 167.86.97.134 44.195.225.114 103.102.159.19 122.161.79.104 106.219.165.65 106.219.160.94 108.218.24.37 103.209.76.35 39.37.139.90 103.83.89.126 187.77.23.102 106.219.163.108 162.120.188.247 203.215.180.120 203.130.22.162 125.209.112.96 101.53.234.82 72.255.51.87 203.130.22.160 103.84.54.48 12.202.95.197 154.208.32.114 54.166.224.59 110.93.201.77"
      WHITELIST_RDNS: ".googlebot.com .search.msn.com .bing.com .google.com"
      WHITELIST_USER_AGENT: "gptbot chatgpt-user perplexitybot"
      BLACKLIST_USER_AGENT: "curl wget scrapy libwww python httpie okhttp"
      BLACKLIST_COUNTRY: "DZ BD CN CO ET HK IR IQ RU SY VE VN AR"
      BLACKLIST_URI: '\.php$ \.asp$ \.jsp$ \.exe$ \.dll$ \.sh$ \.cgi$'
      BLACKLIST_COMMUNITY_LISTS: "ipsum abuse ipaddr"
      USE_ANTIBOT: "yes"
      ANTIBOT_ONLY_COUNTRY: "GB CA DE FR AU JP NL IT ES"
      # Rate limiting and whitelist for alphansn.com and www.alphansn.com
      alphansn.com_LIMIT_REQ_URL_1: "^/api/sites/[0-9]+/(rfq|contact)"
      alphansn.com_LIMIT_REQ_RATE_1: "10/300s"
      alphansn.com_WHITELIST_URI: "^/api/sites/[^/]+/rfq ^/api/sites/[^/]+/contact"
      alphansn.com_LIMIT_REQ_URL_2: "^/(login|auth)"
      alphansn.com_LIMIT_REQ_RATE_2: "50/300s"
      alphansn.com_LIMIT_REQ_URL_3: "^/(api|search|download|products)"
      alphansn.com_LIMIT_REQ_RATE_3: "300/300s"
      alphansn.com_LIMIT_REQ_URL_4: "/"
      alphansn.com_LIMIT_REQ_RATE_4: "500/300s"
      www.alphansn.com_LIMIT_REQ_URL_1: "^/api/sites/[0-9]+/(rfq|contact)"
      www.alphansn.com_LIMIT_REQ_RATE_1: "10/300s"
      www.alphansn.com_WHITELIST_URI: "^/api/sites/[^/]+/rfq ^/api/sites/[^/]+/contact"
      www.alphansn.com_LIMIT_REQ_URL_2: "^/(login|auth)"
      www.alphansn.com_LIMIT_REQ_RATE_2: "50/300s"
      www.alphansn.com_LIMIT_REQ_URL_3: "^/(api|search|download|products)"
      www.alphansn.com_LIMIT_REQ_RATE_3: "300/300s"
      www.alphansn.com_LIMIT_REQ_URL_4: "/"
      www.alphansn.com_LIMIT_REQ_RATE_4: "500/300s"

    volumes:
      - bw-storage:/data
      - ./bw-data/configs:/data/configs
    restart: "unless-stopped"
    networks:
      - bw-universe
      - bw-db

  bw-ui:
    image: bunkerity/bunkerweb-ui:1.6.14
    environment:
      <<: *bw-db-env
      ADMIN_USERNAME: "${ADMIN_USERNAME}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      OVERRIDE_ADMIN_CREDS: "yes"
      UI_FORWARDED_ALLOW_IPS: "10.0.0.0/8"
      UI_PROXY_ALLOW_IPS: "10.0.0.0/8"
      LOG_TYPES: "stderr"
      ENABLE_HEALTHCHECK: "yes"
    volumes:
      - bw-ui-data:/data
    depends_on:
      - bw-db
      - bunkerweb
    restart: "unless-stopped"
    networks:
      - bw-universe
      - bw-db

  bw-db:
    image: mariadb:11
    command: --max-allowed-packet=67108864
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: "bunkerweb"
      MYSQL_USER: "bunkerweb"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - bw-db-data:/var/lib/mysql
    restart: "unless-stopped"
    networks:
      - bw-db

  assembly-app:
    build: ./app
    restart: "unless-stopped"
    networks:
      - bw-services

  syslog:
    image: balabit/syslog-ng:4.10.2
    volumes:
      - bw-logs:/var/log
      - ./crowdsec/syslog-ng.conf:/etc/syslog-ng/syslog-ng.conf:ro
    networks:
      bw-universe:
        ipv4_address: 10.20.30.254

  crowdsec:
    image: crowdsecurity/crowdsec:v1.7.8
    environment:
      BOUNCER_KEY_bunkerweb: "${CROWDSEC_API_KEY}"
      COLLECTIONS: "bunkerity/bunkerweb"
    volumes:
      - crowdsec-data:/var/lib/crowdsec/data
      - bw-logs:/var/log:ro
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
    depends_on:
      - syslog
    networks:
      - bw-universe

volumes:
  bw-storage:
  bw-logs:
  crowdsec-data:
  bw-ui-data:
  bw-db-data:

networks:
  bw-universe:
    name: bw-universe
    ipam:
      driver: default
      config:
        - subnet: 10.20.30.0/24
  bw-services:
    name: bw-services
  bw-db:
    name: bw-db
